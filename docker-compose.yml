version: '3.8'

services:
  # Máy chủ Cơ sở dữ liệu SQL Server
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: kyniem_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MatKhauSieuManh@123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  # Máy chủ Backend
  backend:
    build:
      context: ./Backend/KyNiem6Nam
      dockerfile: Dockerfile
    container_name: kyniem_backend
    depends_on:
      - sqlserver
    ports:
      - "7121:8080" 
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Kyniem6Nam;User Id=sa;Password=MatKhauSieuManh@123;TrustServerCertificate=True;
      - Jwt__Key=KyNiem6Nam_SecretKey_PhaiDaiHon256Bits_NghiaVaMai_123456
      - Jwt__Issuer=KyNiem6NamApp
      - Jwt__Audience=KyNiem6NamUser


  # Máy chủ Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: kyniem_frontend
    depends_on:
      - backend
    ports:
      - "80:80" # Truy cập ở localhost (không cần đuôi :4200 nữa)

volumes:
  sqlserver_data:     